# Dependency updates arrive as reviewable pull requests rather than as a build
# that broke overnight.
#
# Note the tension with CONTRIBUTING.md: pull requests are not accepted here,
# because scripts/hooks/commit-msg and the CI authorship job enforce a single
# author. Dependabot's PRs are therefore read as *notifications with a diff* —
# the change is applied locally, the lock is regenerated, and the PR is closed.
# That is more useful than the alternative, which is finding out from a red
# build weeks later.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the ML stack: these move together and reviewing them
      # together is the only way to tell whether a metric shifted.
      ml:
        patterns: ["scikit-learn", "xgboost", "lightgbm", "catboost", "shap", "numpy", "pandas", "scipy"]
      tooling:
        patterns: ["ruff", "black", "mypy", "pytest*", "*-stubs", "types-*"]
    ignore:
      # pandas 3 changes the default string dtype and makes Copy-on-Write
      # permanent — a silent behaviour change in a categorical-heavy pipeline.
      # It is a deliberate migration, not an automated bump.
      - dependency-name: pandas
        versions: [">=3.0"]
      # pandas-stubs tracks pandas versions. While pandas is held at 2.x, the
      # 3.x stubs describe an API this project does not have and mypy would
      # check against the wrong library — the exact trap requirements-lint.txt
      # already warns about. Unpin this the same day pandas moves, not before.
      - dependency-name: pandas-stubs
        versions: [">=3.0"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # Both blocked upstream, both verified rather than assumed:
      #   eslint 10 crashes inside eslint-config-next's bundled
      #     eslint-plugin-react, which cannot read the React version and throws
      #     before linting anything.
      #   typescript 7 is refused outright by typescript-eslint
      #     ("typescript-eslint does not support TS 7.0"), so `npx eslint src`
      #     exits 2 even though tsc and `next build` both pass. TypeScript *6*
      #     was tested separately and is fine — the bound is >=7 and not >=6
      #     for that reason, because "a major bump broke it" would have thrown
      #     away a working upgrade.
      # Both come back monthly otherwise. Revisit when eslint-config-next
      # ships support; see typescript-eslint#10940 for the TS side.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
