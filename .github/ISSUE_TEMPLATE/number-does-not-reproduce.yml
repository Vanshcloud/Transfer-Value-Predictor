name: A number does not reproduce
description: A figure in the README, a model card or a report disagrees with your run.
title: "[repro] "
labels: ["reproducibility"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable issue you can file. Every figure in the README
        is regenerated by a command named beside it; if one disagrees with your
        run, either the documentation is stale or the pipeline is not
        deterministic, and both are bugs.
  - type: input
    id: claim
    attributes:
      label: Which number, and where it is stated
      placeholder: "README 'Baselines' table, temporal / performance-only, MAE €4.52M"
    validations: { required: true }
  - type: input
    id: observed
    attributes:
      label: What you got instead
      placeholder: "MAE €4.61M"
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran, and its output
      render: shell
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "`python -V`, OS, and whether the data came from a fresh `scripts/fetch_data.py`."
      placeholder: |
        Python 3.13.1, Ubuntu 24.04
        Dataset downloaded 2026-09-01
    validations: { required: true }
