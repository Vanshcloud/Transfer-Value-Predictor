# ============================================================
# pyproject.toml — project metadata and tool configuration
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-value-predictor"
description = "Predict the market value of professional footballers, and explain each prediction"
readme = "README.md"
# 3.13 is chosen over 3.12/3.14 for wheel-coverage headroom: the full ML stack
# (sklearn, xgboost, lightgbm, catboost, shap) ships prebuilt wheels for all
# three, and 3.13 has the longest track record of the three going forward.
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
dynamic = ["version", "dependencies"]
authors = [{name = "Vansh Tomar", email = "vanshwar@gmail.com"}]
maintainers = [{name = "Vansh Tomar", email = "vanshwar@gmail.com"}]
keywords = ["football", "soccer", "machine-learning", "market-value", "analytics", "shap"]

# Version is read from src/__init__.py rather than repeated here. Phase 13's
# audit found 0.1.0 in five places while the release tag said v1.0.0; the
# fix is fewer copies, plus a test that fails when the survivors disagree.
[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET"]
ignore = ["E501"]  # line length is Black's job

[tool.black]
line-length = 100
target-version = ["py313"]

# ---- MyPy ----
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# NOTE: per-package `ignore_missing_imports` overrides are added by the phase
# that introduces the import, not up front. Listed before anything imports them,
# mypy reports them as unused sections — a gate that prints noise on a clean run
# is a gate people learn to skim.

# scikit-learn ships no py.typed marker and no bundled stubs. Introduced in
# Phase 6 (splits, baselines, metrics).
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# joblib, catboost and shap likewise. xgboost and lightgbm ship their own
# types. Introduced in Phases 7 and 8 (model persistence, explainability).
[[tool.mypy.overrides]]
module = ["catboost.*", "joblib.*", "shap.*"]
ignore_missing_imports = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
# Deprecation warnings are errors. Pydantic v1 idioms (`@validator`, `.dict()`,
# `class Config`) and FastAPI's `@app.on_event` all still *run* — they only
# warn — so without this a v1 idiom lands silently and is found much later.
# Third-party warnings get a targeted ignore here when the dependency that
# raises them is actually introduced, never a blanket one.
filterwarnings = [
    "error::DeprecationWarning",
    # joblib 1.5.3's unpickler sets .shape on a NumPy array, which NumPy 2.5
    # deprecates. Raised inside joblib, on every artifact load, and not
    # something this project can fix or avoid while using joblib. Targeted at
    # the one message and the one module rather than blanket-ignoring
    # DeprecationWarning, which would let a real one through. Introduced in
    # Phase 7 with model persistence.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
    # shap builds its colormaps at import time using matplotlib's set_bad /
    # set_over / set_under, which matplotlib 3.11 flags as pending. Raised on
    # `import shap`, so it fires on any test that touches explainability, and
    # nothing in this project can avoid it. Introduced in Phase 8.
    "ignore:The set_(bad|over|under) function will be deprecated:PendingDeprecationWarning",
    # pandas 2.3.3 builds a NaT for a datetime column inside
    # `concatenate_managers` with `np.datetime64("NaT")` — no unit — and numpy
    # 2.5 deprecates the generic unit. It fires on *any* concat of frames with
    # a datetime column, which Phase 15's service does when it appends the
    # season-in-progress rows to the labelled panel. Nothing in this project
    # can avoid it: the dtypes on both sides are already datetime64[ns] and the
    # call is pandas' own. Targeted at the one message and the one module
    # rather than blanket-ignoring DeprecationWarning, which would let a real
    # one through. Revisit when pandas 2.4 lands.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:pandas.core.internals.concat",
]
markers = [
    "integration: needs downloaded data or a trained model (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]
