# ============================================================
# API + dashboard
# ============================================================
# Postgres is deliberately absent. The storage layer sits behind a Protocol
# (src/storage/base.py) so adding it later is a second implementation rather
# than a rewrite, and running a database this project does not yet read from
# would be a service to maintain for no measured benefit.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only. SECURITY.md: without a reverse proxy for rate limits,
      # timeouts and TLS this service must not face a network directly. A
      # proxy on this host reaches it here; elsewhere, publish it deliberately.
      - "127.0.0.1:8000:8000"
    # Both images already run as a non-root user; this stops them regaining
    # privilege and drops capabilities neither server needs on a high port.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      # The dashboard's browser origin. Listed rather than wildcarded: this API
      # is read-only and unauthenticated today, and "*" would be a habit that
      # becomes wrong the moment either changes.
      CORS_ORIGINS: "http://localhost:3000"
      LOG_LEVEL: INFO
    volumes:
      # Mounted, not baked in. The parquet panel is hundreds of megabytes and
      # refreshes weekly; the models are regenerated by scripts/train_models.py.
      # An image containing either is stale the day it is built.
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    # Measured: ~710 MB resident with both tables loaded, before any request.
    # 2 GB leaves room for SHAP and the neighbour indexes without letting a
    # runaway take the host down.
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time, so it must be the URL a
        # *browser* can reach — not the compose service name, which only
        # resolves inside the network.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    cpus: 1
